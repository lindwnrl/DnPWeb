<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html"> Beranda </a></li>
                <li><a href="list.html"> Daftar Buku </a></li>
                <li><a href="tambah.html"> Tambah Buku </a></li>
                <li><a href="../anggota/list.html"> Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html"> Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>        
            <form id="form-tambah">
                <h1>Tambah Buku</h1>
                <p>
                    <label for="judul">Judul</label>
                    <input type="text" name="judul" id="judul"required>
                </p>
                <p>
                    <label for="pengarang">Pengarang</label>
                    <input type="text" name="pengarang" id="pengarang"required>
                </p>
                <p>
                    <label for="tahun">Tahun Terbit</label>
                    <input type="number" id="tahun" name="tahun" min="1990" max="2026"required>
                </p>
                <p>
                    <label for="isbn">ISBN</label>
                    <input type="text" name="isbn" id="isbn">
                </p>
                <p><label for="stok">Stok</label>
                    <input type="number" name="stok" id="stok" min="0"required>
                </p>
                <p>
                    <label for="kategori">Kategori</label>
                    <select name="kategori" id="kategori">
                        <option value="fiksi">Fiksi</option>
                        <option value="non-fiksi">Non-Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
                
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1 & 2</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>
</html>
