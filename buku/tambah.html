<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toogle" class="nav-toogle">
        <label for="nav-toogle" class="nav-toogle-label">&#9776</label>
        <nav>
            <ul>
                <li><a href="../index.html"> Beranda </a></li>
                <li><a href="list.html"> Daftar Buku </a></li>
                <li><a href="tambah.html"> Tambah Buku </a></li>
                <li><a href="../anggota/list.html"> Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html"> Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>
    <section>

        <h1>Tambah Buku</h1>
        <form action="">
            <div class="mb-3">
                <p>
                    <label for="judul" class="form-label fw-semibold">Judul</label>
                    <input type="text" class="form-control" name="judul" id="judul"required>
                </p>
            </div>
            <p>
                <label for="pengarang">Pengarang</label>
                <input type="text" name="pengarang" id="pengarang"required>
            </p>
            <p>
                <label for="tahun">Tahun Terbit</label>
                <input type="number" id="tahun" name="tahun" min="1990" max="2026"required>
            </p>
            <p>
                <label for="isbn">ISBN</label>
                <input type="text" name="isbn" id="isbn">
            </p>
            <p><label for="stok">Stok</label>
                <input type="number" name="stok" id="stok" min="0"required>
            </p>
            <div class="mb-3">
                <p>
                    <label for="kategori" class="form-label fw-semibold" >Kategori</label>
                    <select class="form-select" name="kategori" id="kategori">
                        <option value="fiksi">Fiksi</option>
                        <option value="non-fiksi">Non-Fiksi</option>
                        <option value="referensi">Referensi</option>
                    </select>
                </p>
            </div>
            <p>
                <button type="submit" class="btn" style="background-color: #1dc88a;">Simpan</button>
            </p>
            
        </form>
    </section>
    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1 & 2</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</body>
</html>
